# Traffic Monitor: backend (API + model workers) + frontend (React, served by nginx)
#
#   docker compose up --build        ->  app:  http://localhost:8080      API docs: http://localhost:8000/docs
#
# Settings come from a file named .env next to this one (copy .env.example). All optional.
name: traffic-monitor

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: traffic-monitor-backend
    restart: unless-stopped
    environment:
      DATA_DIR: /app/backend_data
      MOCK_DETECTOR: ${MOCK_DETECTOR:-0}
      MOCK_SCRIPT: ${MOCK_SCRIPT:-accident:5-10,congestion:25-40}
      API_KEY: ${API_KEY:-}
      SEND_MODE: ${SEND_MODE:-dry_run}
      TEST_RECIPIENT: ${TEST_RECIPIENT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-traffic-alerts@localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MAX_RADIUS_KM: ${MAX_RADIUS_KM:-50}
      ACK_TIMEOUT_MIN: ${ACK_TIMEOUT_MIN:-10}
      COOLDOWN_S: ${COOLDOWN_S:-90}
    volumes:
      - .:/app                                 # your code, videos/, temporal.pth, labels.csv, features/
      - backend_data:/app/backend_data         # database, clips, snapshots, outbox (named volume: SQLite is safer here than on a Windows bind mount)
      - torch_cache:/root/.cache/torch         # downloaded ResNet18 weights (first run needs internet)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    image: traffic-monitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend_data:
  torch_cache:
