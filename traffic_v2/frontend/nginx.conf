server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2g;               # video uploads

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;                 # live MJPEG camera streams
    proxy_request_buffering off;         # stream big uploads straight through
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /public/ {                    # signed links inside alert emails
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /ws/ {                        # live event push (WebSocket)
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;          # single-page app: any route serves index.html
  }
}
